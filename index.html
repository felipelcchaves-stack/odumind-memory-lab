    <!-- Dynamic Pixel Loading Script -->
    <script>
      (async function() {
        console.log('[Tracking] Iniciando carregamento de scripts de tracking...');
        
        try {
          // Fetch public settings from backend
          const response = await fetch('https://wmwuirqdluzjdqtmfzsm.supabase.co/functions/v1/get-public-settings');
          if (!response.ok) throw new Error('Failed to load settings: ' + response.status);
          
          const settings = await response.json();
          console.log('[Tracking] Settings carregados:', Object.keys(settings));
          
          // Check if tracking is enabled
          if (settings.tracking_enabled !== 'true') {
            console.log('[Tracking] Tracking está desabilitado nas configurações');
            return;
          }
          
          console.log('[Tracking] Tracking habilitado, processando scripts...');

          // 1. Inject custom_head_scripts if exists (PRIORITY - runs first)
          if (settings.custom_head_scripts && settings.custom_head_scripts.trim()) {
            console.log('[Tracking] Injetando custom_head_scripts...');
            try {
              const tempContainer = document.createElement('div');
              tempContainer.innerHTML = settings.custom_head_scripts;
              
              // Process and execute scripts
              const scripts = tempContainer.querySelectorAll('script');
              let scriptsLoaded = 0;
              
              scripts.forEach(function(oldScript) {
                const newScript = document.createElement('script');
                
                // Copy all attributes
                Array.from(oldScript.attributes).forEach(function(attr) {
                  newScript.setAttribute(attr.name, attr.value);
                });
                
                // Copy inline content
                if (oldScript.textContent) {
                  newScript.textContent = oldScript.textContent;
                }
                
                // If external script, set async
                if (oldScript.src) {
                  newScript.async = true;
                }
                
                document.head.appendChild(newScript);
                scriptsLoaded++;
              });
              
              // Add non-script elements (like noscript, img for tracking)
              Array.from(tempContainer.children).forEach(function(el) {
                if (el.tagName !== 'SCRIPT') {
                  document.head.appendChild(el.cloneNode(true));
                }
              });
              
              console.log('[Tracking] custom_head_scripts injetados:', scriptsLoaded, 'scripts');
            } catch (headError) {
              console.error('[Tracking] Erro ao injetar custom_head_scripts:', headError);
            }
          } else {
            console.log('[Tracking] Nenhum custom_head_scripts configurado');
          }

          // 2. Load Meta Pixel via ID (only if not already loaded via custom scripts)
          if (settings.meta_pixel_id && settings.meta_pixel_id.trim() && !window.fbq) {
            console.log('[Tracking] Carregando Meta Pixel via ID:', settings.meta_pixel_id);
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', settings.meta_pixel_id);
            fbq('track', 'PageView');
            console.log('[Tracking] Meta Pixel carregado via ID');
          } else if (window.fbq) {
            console.log('[Tracking] Meta Pixel já carregado via custom scripts');
          }

          // 3. Load Google Analytics if configured
          if (settings.google_analytics_id && settings.google_analytics_id.trim() && !window.gtag) {
            console.log('[Tracking] Carregando Google Analytics:', settings.google_analytics_id);
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + settings.google_analytics_id;
            document.head.appendChild(script);
            
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', settings.google_analytics_id);
            console.log('[Tracking] Google Analytics carregado');
          }

          // 4. Load TikTok Pixel if configured
          if (settings.tiktok_pixel_id && settings.tiktok_pixel_id.trim() && !window.ttq) {
            console.log('[Tracking] Carregando TikTok Pixel:', settings.tiktok_pixel_id);
            !function (w, d, t) {
              w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=i,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var o=document.createElement("script");o.type="text/javascript",o.async=!0,o.src=i+"?sdkid="+e+"&lib="+t;var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};
              ttq.load(settings.tiktok_pixel_id);
              ttq.page();
            }(window, document, 'ttq');
            console.log('[Tracking] TikTok Pixel carregado');
          }

          // 5. Load LinkedIn Insight Tag if configured
          if (settings.linkedin_partner_id && settings.linkedin_partner_id.trim() && !window.lintrk) {
            console.log('[Tracking] Carregando LinkedIn Insight Tag:', settings.linkedin_partner_id);
            window._linkedin_partner_id = settings.linkedin_partner_id;
            window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
            window._linkedin_data_partner_ids.push(settings.linkedin_partner_id);
            
            (function(l) {
              if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
              window.lintrk.q=[]}
              var s = document.getElementsByTagName("script")[0];
              var b = document.createElement("script");
              b.type = "text/javascript";b.async = true;
              b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
              s.parentNode.insertBefore(b, s);})(window.lintrk);
            console.log('[Tracking] LinkedIn Insight Tag carregado');
          }

          // 6. Inject custom_body_scripts if exists
          if (settings.custom_body_scripts && settings.custom_body_scripts.trim()) {
            console.log('[Tracking] Injetando custom_body_scripts...');
            try {
              const bodyContainer = document.createElement('div');
              bodyContainer.innerHTML = settings.custom_body_scripts;
              
              const bodyScripts = bodyContainer.querySelectorAll('script');
              bodyScripts.forEach(function(oldScript) {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(function(attr) {
                  newScript.setAttribute(attr.name, attr.value);
                });
                if (oldScript.textContent) {
                  newScript.textContent = oldScript.textContent;
                }
                if (oldScript.src) {
                  newScript.async = true;
                }
                document.body.appendChild(newScript);
              });
              
              console.log('[Tracking] custom_body_scripts injetados');
            } catch (bodyError) {
              console.error('[Tracking] Erro ao injetar custom_body_scripts:', bodyError);
            }
          }
          
          console.log('[Tracking] Carregamento de scripts finalizado com sucesso');
          
        } catch (error) {
          console.error('[Tracking] Erro ao carregar tracking pixels:', error);
        }
      })();
    </script>
  </head>
